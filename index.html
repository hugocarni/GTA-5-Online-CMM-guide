<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Criminal Mastermind · Guía GTA Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0c0e0d;
    --panel: #151917;
    --panel-2: #1c211e;
    --line: #2a312d;
    --text: #e8ece9;
    --muted: #8b958f;
    --accent: #5fd068;
    --accent-dim: #2f6b35;
    --warn: #f2c230;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; height: 100%;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(95,208,104,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(95,208,104,.035) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--text);
    font-family: "Oswald", "Arial Narrow", Impact, sans-serif;
    letter-spacing: .02em;
  }
  .app { display: grid; grid-template-columns: 280px 1fr; height: 100%; }

  /* Sidebar */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .brand { padding: 22px 20px 18px; border-bottom: 1px solid var(--line); }
  .brand small { color: var(--accent); font-size: 12px; letter-spacing: .3em; text-transform: uppercase; }
  .brand h1 { margin: 4px 0 0; font-size: 26px; line-height: 1; text-transform: uppercase; font-weight: 700; }
  .brand h1 span { color: var(--accent); }
  nav { display: flex; flex-direction: column; padding: 14px 12px; gap: 6px; }
  .nav-label { color: var(--muted); font-size: 11px; letter-spacing: .25em; text-transform: uppercase; padding: 10px 8px 4px; }
  .nav-btn {
    display: flex; align-items: center; gap: 12px;
    background: transparent; color: var(--text);
    border: 1px solid transparent; border-left: 3px solid var(--line);
    padding: 12px 14px; text-align: left; cursor: pointer;
    font: inherit; font-size: 16px; text-transform: uppercase; letter-spacing: .06em;
    transition: background .15s, border-color .15s, color .15s;
  }
  .nav-btn .num { color: var(--muted); font-size: 13px; min-width: 22px; }
  .nav-btn:hover { background: var(--panel-2); border-left-color: var(--accent-dim); }
  .nav-btn.active { background: var(--panel-2); border-left-color: var(--accent); color: var(--accent); }
  .nav-btn.active .num { color: var(--accent); }
  .nav-btn:focus-visible, .back:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Main */
  main { overflow-y: auto; padding: 36px clamp(20px, 4vw, 56px) 56px; }
  .kicker { color: var(--accent); font-size: 13px; letter-spacing: .3em; text-transform: uppercase; }
  h2 { margin: 6px 0 8px; font-size: clamp(32px, 5vw, 54px); text-transform: uppercase; line-height: 1; font-weight: 700; }
  .lead { color: var(--muted); font-family: "Special Elite", "Courier New", monospace; max-width: 60ch; line-height: 1.5; margin: 0 0 30px; }
  .rule { height: 3px; width: 72px; background: var(--accent); margin: 14px 0 26px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card {
    position: relative; text-align: left; cursor: pointer;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--line); padding: 22px 20px 20px; min-height: 150px;
    font: inherit; display: flex; flex-direction: column; justify-content: space-between;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .card::after { content: ""; position: absolute; top: 0; right: 0; border: 14px solid transparent; border-top-color: var(--line); border-right-color: var(--line); transition: .15s; }
  .card:hover { transform: translateY(-3px); border-color: var(--accent); background: var(--panel-2); }
  .card:hover::after { border-top-color: var(--accent); border-right-color: var(--accent); }
  .card .idx { color: var(--accent); font-size: 14px; letter-spacing: .25em; }
  .card .name { font-size: 24px; text-transform: uppercase; font-weight: 600; line-height: 1.1; }
  .card .tag { color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; }

  .back {
    display: inline-flex; align-items: center; gap: 8px; margin-bottom: 26px;
    background: transparent; color: var(--text); border: 1px solid var(--line);
    padding: 10px 18px; cursor: pointer; font: inherit; font-size: 14px;
    text-transform: uppercase; letter-spacing: .15em; transition: .15s;
  }
  .back:hover { border-color: var(--accent); color: var(--accent); }

  .sections { display: grid; gap: 16px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); padding: 20px 22px; }
  .box h3 { margin: 0 0 8px; font-size: 18px; text-transform: uppercase; letter-spacing: .12em; color: var(--warn); }
  .box p { margin: 0; color: var(--muted); font-family: "Special Elite", "Courier New", monospace; line-height: 1.5; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
    .brand { padding: 14px 16px 10px; }
    .brand h1 { font-size: 20px; }
    nav { flex-direction: row; overflow-x: auto; padding: 10px 12px; }
    .nav-label { display: none; }
    .nav-btn { white-space: nowrap; border-left-width: 1px; border-bottom: 3px solid var(--line); padding: 10px 12px; font-size: 14px; }
    .nav-btn.active { border-bottom-color: var(--accent); }
    .nav-btn .num { display: none; }
    main { padding: 24px 18px 40px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <small>GTA Online · Guía</small>
      <h1>Criminal <span>Mastermind</span></h1>
    </div>
    <nav id="nav" aria-label="Navegación principal"></nav>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>

<script>
  // Datos editables: añade o quita golpes aquí
  const HEISTS = [
    { id: "fleeca",   name: "Fleeca" },
    { id: "prison",   name: "Fuga de la prisión" },
    { id: "humane",   name: "Laboratorio Humane" },
    { id: "series-a", name: "Financiacion Inicial" },
    { id: "pacific",  name: "Pacific Standart" }
  ];

  const nav = document.getElementById("nav");
  const main = document.getElementById("main");

  function pad(n) { return String(n).padStart(2, "0"); }

  function buildNav(activeId) {
    nav.innerHTML = "";
    const home = document.createElement("button");
    home.className = "nav-btn" + (activeId === "inicio" ? " active" : "");
    home.innerHTML = '<span class="num">◆</span><span>Inicio</span>';
    home.onclick = () => go("inicio");
    nav.appendChild(home);

    const label = document.createElement("div");
    label.className = "nav-label";
    label.textContent = "Golpes";
    nav.appendChild(label);

    HEISTS.forEach((h, i) => {
      const b = document.createElement("button");
      b.className = "nav-btn" + (activeId === h.id ? " active" : "");
      b.innerHTML = '<span class="num">' + pad(i + 1) + '</span><span></span>';
      b.lastChild.textContent = h.name;
      b.onclick = () => go(h.id);
      nav.appendChild(b);
    });
  }

  function renderHome() {
    main.innerHTML =
      '<div class="kicker">Panel de planificación</div>' +
      '<h2>Inicio</h2><div class="rule"></div>' +
      '<p class="lead">Elige un golpe para ver su información y sus preliminares.</p>' +
      '<div class="grid" id="grid"></div>';
    const grid = document.getElementById("grid");
    HEISTS.forEach((h, i) => {
      const c = document.createElement("button");
      c.className = "card";
      c.innerHTML = '<span class="idx">GOLPE ' + pad(i + 1) + '</span><span class="name"></span><span class="tag">Ver información →</span>';
      c.querySelector(".name").textContent = h.name;
      c.onclick = () => go(h.id);
      grid.appendChild(c);
    });
  }

  function renderHeist(h) {
    const i = HEISTS.indexOf(h);
    main.innerHTML =
      '<button class="back" id="back">← Atrás</button>' +
      '<div class="kicker">Golpe ' + pad(i + 1) + '</div>' +
      '<h2></h2><div class="rule"></div>' +
      '<div class="sections">' +
        '<div class="box"><h3>Información del golpe</h3><p>Contenido próximamente.</p></div>' +
        '<div class="box"><h3>Preliminares</h3><p>Contenido próximamente.</p></div>' +
      '</div>';
    main.querySelector("h2").textContent = h.name;
    document.getElementById("back").onclick = () => go("inicio");
  }

  function go(id) {
    if (location.hash !== "#" + id) location.hash = id;
    else render();
  }

  function render() {
    const id = location.hash.replace("#", "") || "inicio";
    const h = HEISTS.find(x => x.id === id);
    const active = h ? h.id : "inicio";
    buildNav(active);
    if (h) renderHeist(h); else renderHome();
    main.scrollTop = 0;
  }

  window.addEventListener("hashchange", render);
  render();
</script>
</body>
</html>
